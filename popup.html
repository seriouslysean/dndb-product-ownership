<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="header">
    <h1 class="header__title">D&D Beyond Library</h1>
    <p class="header__summary" id="summary"></p>
  </header>

  <section class="gate" id="login-gate" hidden>
    <p id="login-message">Open <a href="#" class="gate__link" id="open-marketplace">marketplace.dndbeyond.com</a> and sign in to sync your library.</p>
  </section>

  <section class="gate" id="syncing-gate" hidden>
    <div class="gate__spinner"></div>
    <p id="syncing-message">Syncing...</p>
  </section>

  <main class="main" id="main-content" hidden>
    <aside class="settings" id="settings-panel" hidden>
      <fieldset class="settings__section">
        <legend class="settings__label">Format</legend>
        <div class="toggle" id="format-toggle"></div>
      </fieldset>
      <fieldset class="settings__section">
        <legend class="settings__label">Publisher</legend>
        <div class="toggle" id="publisher-toggle"></div>
      </fieldset>
      <fieldset class="settings__section">
        <legend class="settings__label">Categories</legend>
        <div class="filters" id="filters"></div>
      </fieldset>
      <section class="settings__section">
        <h3 class="settings__label">Stats</h3>
        <div class="settings__stats" id="stats"></div>
      </section>
      <section class="settings__section">
        <button class="settings__btn" id="undismiss-btn">Reset Dismissed Products</button>
      </section>
    </aside>
    <search class="search">
      <input class="search__input" id="search-input" type="search" placeholder="Search products...">
    </search>
    <div class="product-list" id="product-list" role="list"></div>
  </main>

  <footer class="footer">
    <time class="footer__updated" id="last-updated"></time>
    <nav class="footer__actions">
      <button class="footer__btn" id="refresh-btn">Refresh</button>
      <button class="footer__btn" id="settings-btn" title="Settings" aria-label="Settings">&#9881;</button>
    </nav>
  </footer>

  <script src="constants.js"></script>
  <script src="shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
