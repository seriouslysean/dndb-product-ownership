<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <h1>D&D Beyond Library</h1>
    <p id="summary" class="summary"></p>
  </div>

  <div id="login-gate" class="gate" style="display:none">
    <p id="login-message">Open <a href="#" id="open-marketplace">marketplace.dndbeyond.com</a> and sign in to sync your library.</p>
  </div>

  <div id="syncing-gate" class="gate" style="display:none">
    <div class="spinner"></div>
    <p>Syncing your library...</p>
  </div>

  <div id="main-content" style="display:none">
    <div class="filter-bar">
      <div class="toggle-row">
        <div id="format-toggle" class="toggle-group"></div>
        <div id="publisher-toggle" class="toggle-group"></div>
      </div>
      <div id="filters" class="filters"></div>
    </div>
    <div id="product-list" class="product-list"></div>
  </div>

  <div class="footer">
    <span id="last-updated" class="last-updated"></span>
    <button id="refresh-btn" class="refresh-btn">Refresh</button>
  </div>

  <script src="constants.js"></script>
  <script src="shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
