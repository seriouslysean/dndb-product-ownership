<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <h1>D&D Beyond Library</h1>
    <p id="summary" class="summary"></p>
  </div>

  <div id="login-gate" class="gate" style="display:none">
    <p id="login-message">Open <a href="#" id="open-marketplace">marketplace.dndbeyond.com</a> and sign in to sync your library.</p>
  </div>

  <div id="syncing-gate" class="gate" style="display:none">
    <div class="spinner"></div>
    <p id="syncing-message">Syncing...</p>
  </div>

  <div id="main-content" style="display:none">
    <div id="settings-panel" class="settings-panel" style="display:none">
      <div class="settings-section">
        <div class="settings-label">Format</div>
        <div id="format-toggle" class="toggle-group"></div>
      </div>
      <div class="settings-section">
        <div class="settings-label">Publisher</div>
        <div id="publisher-toggle" class="toggle-group"></div>
      </div>
      <div class="settings-section">
        <div class="settings-label">Categories</div>
        <div id="filters" class="filters"></div>
      </div>
      <div class="settings-section">
        <div class="settings-label">Stats</div>
        <div id="stats" class="stats"></div>
      </div>
      <div class="settings-section">
        <button id="undismiss-btn" class="settings-btn">Reset Dismissed Products</button>
      </div>
    </div>
    <div id="product-list" class="product-list"></div>
  </div>

  <div class="footer">
    <span id="last-updated" class="last-updated"></span>
    <div class="footer-actions">
      <button id="refresh-btn" class="footer-btn">Refresh</button>
      <button id="settings-btn" class="footer-btn" title="Settings">&#9881;</button>
    </div>
  </div>

  <script src="constants.js"></script>
  <script src="shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
