pre-commit:
  parallel: true
  jobs:
    - name: test
      run: npm test

    - name: lint-js
      glob: "**/*.js"
      run: npx oxlint {staged_files}

    - name: format-js
      glob: "**/*.js"
      run: npx oxfmt --check {staged_files}

    - name: format-md
      glob: "**/*.md"
      run: npx oxfmt --check {staged_files}

    - name: format-json
      glob: "**/*.json"
      exclude:
        - "node_modules/**"
        - "package-lock.json"
      run: npx oxfmt --check {staged_files}

    - name: lint-css
      glob: "**/*.css"
      run: npx stylelint {staged_files}
