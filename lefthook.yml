pre-commit:
  parallel: true
  jobs:
    - name: test
      run: npm test

    - name: lint-js
      glob: "**/*.js"
      run: npx oxlint {staged_files}

    - name: format-js
      glob: "**/*.js"
      run: npx oxfmt --check {staged_files}

    - name: format-md
      glob: "**/*.md"
      run: npx oxfmt --check {staged_files}

    - name: format-json
      glob: "**/*.json"
      exclude:
        - "node_modules/**"
        - "package-lock.json"
      run: npx oxfmt --check {staged_files}

    - name: lint-css
      glob: "**/*.css"
      run: npx stylelint {staged_files}

pre-push:
  jobs:
    - name: ci
      # git sets repo-local variables for a hook; from a linked worktree GIT_DIR in them breaks the git that tools run.
      run: |
        unset $(git rev-parse --local-env-vars)
        npm test && npm run lint && npm run format:check
