pre-commit:
  parallel: true
  jobs:
    - name: test
      run: npm test

    - name: typecheck
      run: npm run typecheck

    - name: build
      run: npm run build

    - name: lint-code
      glob: "**/*.{js,ts,vue}"
      run: npx oxlint --vue-plugin {staged_files}

    - name: format
      glob: "**/*.{css,html,js,json,md,ts,vue,yml}"
      exclude:
        - "node_modules/**"
        - "package-lock.json"
      run: npx oxfmt --check {staged_files}

    - name: lint-css
      glob: "src/**/*.css"
      run: npx stylelint {staged_files}
